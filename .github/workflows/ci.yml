name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  rust:
    name: Rust unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      # The test binary embeds libpython; point the loader at setup-python's copy.
      - run: cargo test --release
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib

  parity:
    name: pytest (py${{ matrix.python }}, Django ${{ matrix.django }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.1"]
        include:
          - { os: ubuntu-24.04-arm, python: "3.13", django: "5.2" }
          - { os: ubuntu-24.04-arm, python: "3.13", django: "6.1" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and install
        run: pip install "Django==${{ matrix.django }}.*" pytest hypothesis .
      - name: Parity tests and fuzzer
        run: pytest -q
        env:
          DTL_FUZZ_ITERS: "1000"

  django-suite:
    name: Django ${{ matrix.django }} template suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        django: ["5.2", "6.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Build and install
        run: pip install "Django==${{ matrix.django }}.*" .
      - name: Run Django's template tests through the Rust engine
        run: python scripts/run_django_test_suite.py --branch stable/${{ matrix.django }}.x

  benchmark:
    name: Benchmark (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: pip install "Django==6.1.*" jinja2 .
      - run: python benchmarks/bench.py --json bench-${{ matrix.os }}.json | tee bench-${{ matrix.os }}.txt
      - run: python benchmarks/jinja2_bench.py --json bench-jinja2-${{ matrix.os }}.json | tee bench-jinja2-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: bench-*${{ matrix.os }}.*
